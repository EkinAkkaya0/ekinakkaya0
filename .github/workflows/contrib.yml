name: Katkı Takvimi

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/gen_contrib.py"
      - ".github/workflows/contrib.yml"

concurrency:
  group: contrib
  cancel-in-progress: true

jobs:
  uret:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Takvimi üret
        run: python tools/gen_contrib.py

      - name: Değiştiyse işle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-light.svg assets/contrib-dark.svg
          git diff --staged --quiet && echo "değişiklik yok" && exit 0
          git commit -m "katkı takvimi güncellendi"
          git push
