name: Aktivite Paneli

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/gen_activity.py"
      - "tools/gen_badges.py"
      - ".github/workflows/activity.yml"

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  uret:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paneli üret
        run: python tools/gen_activity.py

      - name: Görüntülenme rozetini tazele
        run: python tools/gen_badges.py

      - name: Değiştiyse işle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-light.svg assets/activity-dark.svg \
                  assets/badge-views-light.svg assets/badge-views-dark.svg
          git diff --staged --quiet && echo "değişiklik yok" && exit 0
          git commit -m "aktivite paneli ve görüntülenme sayısı güncellendi"
          git push
